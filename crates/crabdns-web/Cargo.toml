[package]
name = "crabdns-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
prof-jemalloc = ["dep:jemalloc_pprof", "dep:tikv-jemalloc-ctl"]

[dependencies]
arc-swap.workspace = true
axum.workspace = true
chrono.workspace = true
crabdns-core.workspace = true
crabdns-storage.workspace = true
dashmap.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
aws-lc-rs.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sigilup.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
ts-rs.workspace = true

[target.'cfg(unix)'.dependencies]
jemalloc_pprof = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, features = ["profiling", "stats", "use_std"], optional = true }

[dev-dependencies]
dhat.workspace = true
sigilup = { workspace = true, features = ["sign"] }
tempfile.workspace = true
