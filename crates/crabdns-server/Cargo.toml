[package]
name = "crabdns-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "crabdns"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
prof-jemalloc = ["dep:tikv-jemallocator", "crabdns-web/prof-jemalloc"]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
crabdns-core.workspace = true
crabdns-storage.workspace = true
crabdns-web.workspace = true
mimalloc.workspace = true
quinn.workspace = true
reqwest.workspace = true
aws-lc-rs.workspace = true
rustls.workspace = true
sigilup.workspace = true
socket2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing = { workspace = true }
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { workspace = true, features = ["profiling", "stats"], optional = true }

[dev-dependencies]
futures-util.workspace = true
hdrhistogram.workspace = true
hickory-proto.workspace = true
proptest.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sigilup = { workspace = true, features = ["sign"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
