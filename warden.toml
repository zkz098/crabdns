# Generated by `cargo warden init`

baseline = "warden-baseline.json"

[dag]
roots = ["crates/crabdns-core/src", "crates/crabdns-server/src", "crates/crabdns-storage/src", "crates/crabdns-web/src"]
forbid_imports = []

# Optional layered architecture rules:
# [[dag.layers]]
# name = "domain"
# modules = ["domain"]
# allow = []

[complexity]
max = 25
paths = ["crates"]
ignore_tests = true
ignore = ["target"]
respect_gitignore = true

[file_length]
max_lines = 800
extensions = ["rs"]
paths = ["crates"]
ignore = ["target", "tests"]
mode = "physical"
respect_gitignore = true

[check]
fmt = true
clippy = true
doc = false

[hygiene]

[manifest]

[ci_parity]

[actions]

[gate]
include_checks = true

[[gate.test_groups]]
name = "workspace"
packages = ["crabdns-core", "crabdns-storage", "crabdns-web", "crabdns-server"]
features = []

[[gate.custom_steps]]
name = "webui"
command = "pnpm fmt:check && pnpm lint && pnpm typecheck && pnpm build"
cwd = "webui"
read_only = false
