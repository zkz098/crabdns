# Generated by `cargo warden init`

[dag]
roots = ["crates/crabdns-core/src", "crates/crabdns-server/src", "crates/crabdns-storage/src", "crates/crabdns-web/src"]
forbid_imports = []

# Optional layered architecture rules:
# [[dag.layers]]
# name = "domain"
# modules = ["domain"]
# allow = []

[complexity]
max = 25
paths = ["crates"]
ignore_tests = true
ignore = ["target"]
respect_gitignore = true

[file_length]
max_lines = 800
extensions = ["rs"]
paths = ["crates"]
ignore = ["target", "tests"]
mode = "physical"
respect_gitignore = true

[check]
fmt = true
clippy = true
doc = false

[gate]
include_checks = true
test_groups = []
