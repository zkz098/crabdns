[workspace]
resolver = "2"
members = [
    "crates/crabdns-core",
    "crates/crabdns-storage",
    "crates/crabdns-web",
    "crates/crabdns-server",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/zkz098/crabdns"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"

[workspace.dependencies]
crabdns-core = { path = "crates/crabdns-core" }
crabdns-storage = { path = "crates/crabdns-storage" }
crabdns-web = { path = "crates/crabdns-web" }

tokio = { version = "1", features = ["full"] }
hickory-proto = { version = "0.26", features = ["dnssec-aws-lc-rs"] }
moka = { version = "0.12", features = ["sync"] }
arc-swap = "1"
fjall = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
toml = "1"
axum = { version = "0.8", features = ["ws", "http2"] }
tower-http = { version = "0.7", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
dashmap = "6"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
quinn = { version = "0.11", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
regex = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
aws-lc-rs = "1"
webpki-roots = "1"
ts-rs = { version = "12", features = ["chrono-impl"] }
proptest = "1"
dhat = "0.3"
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
foldhash = "0.2"
mimalloc = "0.1"
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = "0.7"
jemalloc_pprof = "0.9"
hdrhistogram = { version = "7.6", default-features = false }
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen", "x509-parser"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
sigilup = { version = "0.1.3", features = ["reqwest", "self-replace"] }
x509-parser = "0.18"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
