name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  webui:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile
      - name: Format, lint, typecheck and build
        working-directory: webui
        run: pnpm fmt:check && pnpm lint && pnpm typecheck && pnpm build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: webui/dist

  rust:
    name: Rust Warden Gate
    needs: webui
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - name: Download Web UI dist
        uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-binstall
      - name: Install cargo-warden
        run: cargo binstall -y --no-confirm cargo-warden@0.3.1 || cargo install cargo-warden --version 0.3.1 --locked
      - name: Run cargo warden gate
        run: cargo warden gate --format github-actions --skip webui

  fuzz:
    name: Fuzz Build
    needs: webui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Web UI dist
        uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
